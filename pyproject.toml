[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmfms"
# PEP 440 形式的 0.1.0-alpha；标签写作 v0.1.0-alpha
version = "0.1.0a1"
description = "HMFMS — 配置驱动的农田重金属质量平衡模型"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "netCDF4>=1.6",
    "matplotlib>=3.7",
    "pydantic>=2.5",
]

[project.urls]
Homepage = "https://github.com/YYC-JNU/HMFMS"
Issues = "https://github.com/YYC-JNU/HMFMS/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"